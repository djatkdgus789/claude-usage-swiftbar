name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    # macOS so the plugin runs on the same system python3 (/usr/bin/python3) SwiftBar uses.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: System python version
        run: /usr/bin/python3 --version

      - name: Unit and end-to-end tests
        run: PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -m unittest discover -s tests -v

      - name: Installer syntax
        run: bash -n swiftbar/install.sh

      - name: Smoke test against the real API (fake token)
        run: |
          mkdir -p ~/.claude
          echo '{"claudeAiOauth":{"accessToken":"sk-ant-oat01-invalid","subscriptionType":"pro"}}' > ~/.claude/.credentials.json
          out="$(PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 swiftbar/claude-usage.1m.py)"
          echo "$out"
          echo "$out" | head -n1 | grep -q "Claude"
          echo "$out" | grep -q "Token expired"
